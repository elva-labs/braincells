[package]
name = "store-and-serve-large-media-files"
version = "0.1.0"
edition = "2021"

[dependencies]
aws-config = { version = "1.13.0", features = ["behavior-version-latest"] }
# Keep the current HTTPS client without enabling the legacy Rustls connector.
aws-sdk-dynamodb = { version = "1.117.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-s3 = { version = "1.144.0", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
lambda_http = "0.13.0"
lambda_runtime = "0.13.0"
serde = { version = "1.0.210", features = ["derive"] }
serde_dynamo = { version = "4.2.14", features = ["aws-sdk-dynamodb+1"] }
serde_json = "1.0.128"
tokio = { version = "1", features = ["macros"] }

[[bin]]
name = "download_file"
path = "src/download_file.rs"

[[bin]]
name = "get_presigned_url"
path = "src/get_presigned_url.rs"

[[bin]]
name = "get_uploaded_files"
path = "src/get_uploaded_files.rs"

[[bin]]
name = "process_s3_upload"
path = "src/process_s3_upload.rs"
